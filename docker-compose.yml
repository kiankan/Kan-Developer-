services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["php", "bot.php"]
    # سرورهایی که از داخل ربات اضافه می‌شوند و لاگ عملیات اینجا ذخیره می‌شوند،
    # پس باید بیرون از کانتینر بمانند تا با هر بیلد دوباره از بین نروند.
    volumes:
      - ./data:/app/data

  # صفحه‌ی وضعیت/سلامت (و در صورت نیاز، ورودی وبهوک پشت ریورس‌پراکسی).
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    command: ["sh", "-c", "php -S 0.0.0.0:${LISTEN_PORT:-2000} -t /app /app/serve.php"]
    ports:
      - "${LISTEN_PORT:-2000}:${LISTEN_PORT:-2000}"
    volumes:
      - ./data:/app/data
